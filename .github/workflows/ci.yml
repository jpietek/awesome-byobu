name: portable-terminal-setup
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sh build.sh
      - run: python -m unittest discover -s tests -v
      - run: python -m terminal_setup.cli --cache-dir /tmp/terminal-stats-ci/cache --state-dir /tmp/terminal-stats-ci/state collect --count 3
      - run: python -m terminal_setup.cli --cache-dir /tmp/terminal-stats-ci/cache status
